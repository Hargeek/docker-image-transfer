    - name: Parse Image Name From Issue
      id: parse_image
      run: |
        if [[ -n "${{ github.event.comment.body }}" ]]; then
            image_origin_name="${{ github.event.comment.body }}"
        elif [[ -n "${{ github.event.issue.body }}" ]]; then
            image_origin_name="${{ github.event.issue.body }}"
        else
            echo "No issue body or comment body found."
            exit 1
        fi
        
        echo "Image Origin Name: $image_origin_name"
        # get image name and tag
        image_name_tag=$(echo "$image_origin_name" | awk -F'/' '{
            if (NF == 1) {
                print $1;
            } else if (NF == 2) {
                sub(/^[^\/]*\//, "");
                print $0;
            } else {
                sub(/^[^\/]*\//, "");
                gsub(/\//, "_");
                print $0;
            }
        }')
        # delete @sha256: and other characters
        image_name_tag="${image_name_tag%%@*}"
        transfer_image_name="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"
        echo "Transfer Image Name: $transfer_image_name"
        
        # set output
        echo "image_origin_name=${image_origin_name}" >> $GITHUB_OUTPUT
        echo "transfer_image_name=${transfer_image_name}" >> $GITHUB_OUTPUT

    - name: Transfer Image With Skopeo
      run: |
        sudo apt-get install -y skopeo
        
        image_origin_name="${{ steps.parse_image.outputs.image_origin_name }}"
        transfer_image_name="${{ steps.parse_image.outputs.transfer_image_name }}"
        echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo copy --format v2s2 --dest-creds $ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD --all docker://$image_origin_name docker://$transfer_image_name
